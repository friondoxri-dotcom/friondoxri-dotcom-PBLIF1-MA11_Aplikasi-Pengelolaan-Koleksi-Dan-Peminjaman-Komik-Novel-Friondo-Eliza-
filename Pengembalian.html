<!doctype html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pengembalian - Perpustakaan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    .layout { display: flex; flex: 1; }
    .sidebar { width: 280px; flex-shrink: 0; }
    .content { flex: 1; padding: 2rem; min-width: 0; }
    .sidebar .nav-link i { display: inline-block; width: 1.5rem; }
    @media (max-width: 767.98px) {
      .layout { flex-direction: column; }
      .sidebar { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="d-flex flex-column min-vh-100">

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar bg-body-tertiary border-bottom px-3">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="bi bi-book-half me-2 fs-4"></i> Perpustakaan
      </a>
      <div class="d-flex flex-wrap align-items-center gap-2">
        <form class="d-flex" role="search" action="Koleksi%20Buku.html" method="get">
          <div class="input-group">
            <input type="search" class="form-control" name="q" placeholder="Cari Judul Komik dan Novel ...." aria-label="Cari buku" required>
            <button class="btn btn-outline-secondary" type="submit" aria-label="Cari"><i class="bi bi-search"></i></button>
          </div>
        </form>
        <div id="authNav" class="d-flex flex-wrap align-items-center gap-2"></div>
      </div>
    </nav>

    <div class="layout">

      <!-- ===== SIDEBAR ===== -->
      <aside class="sidebar d-flex flex-column p-3 bg-body-tertiary border-end">
        <ul class="nav nav-pills flex-column mb-auto">
          <li class="nav-item">
            <a href="index.html" class="nav-link link-body-emphasis"><i class="bi bi-house me-2"></i> Beranda</a>
          </li>
          <li>
            <a href="Dashboard.html" class="nav-link link-body-emphasis"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
          </li>
          <li>
            <a href="Koleksi%20Buku.html" class="nav-link link-body-emphasis"><i class="bi bi-journal-bookmark me-2"></i> Koleksi Buku</a>
          </li>
          <li>
            <a href="Peminjaman.html" class="nav-link link-body-emphasis"><i class="bi bi-box-arrow-up-right me-2"></i> Peminjaman</a>
          </li>
          <li>
            <a href="Pengembalian.html" class="nav-link active" aria-current="page"><i class="bi bi-box-arrow-in-down-left me-2"></i> Pengembalian</a>
          </li>
          <li>
            <a href="Riwayat%20peminjaman.html" class="nav-link link-body-emphasis"><i class="bi bi-clock-history me-2"></i> Riwayat Peminjaman</a>
          </li>
        </ul>
        <hr>
      </aside>

      <!-- ===== KONTEN ===== -->
      <main class="content">
        <h1 class="h3 mb-4">Pengembalian</h1>
        <div id="area"></div>
      </main>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data.js"></script>
  <script>
    renderAuthNav();
    const area = document.getElementById('area');

    function tampil() {
      area.textContent = '';
      const daftar = pinjamanTampil().filter(function (p) { return p.status === 'Dipinjam'; });

      const bungkus = el('div', 'table-responsive');
      const tabel = el('table', 'table table-striped table-hover align-middle');

      const thead = el('thead');
      const trh = el('tr');
      ['No', 'Judul', 'Peminjam', 'Tanggal Pinjam', 'Batas Kembali', 'Status', 'Aksi'].forEach(function (t) {
        trh.appendChild(el('th', '', t));
      });
      thead.appendChild(trh);

      const tbody = el('tbody');
      if (daftar.length === 0) {
        tbody.appendChild(barisKosong(7, 'Tidak ada buku yang sedang dipinjam.'));
      }

      daftar.forEach(function (p, i) {
        const tr = el('tr');
        tr.appendChild(el('td', '', String(i + 1)));
        tr.appendChild(el('td', '', p.judul));
        tr.appendChild(el('td', '', p.nama));
        tr.appendChild(el('td', '', formatTanggal(p.tglPinjam)));
        tr.appendChild(el('td', '', formatTanggal(p.tglBatas)));

        const tdStatus = el('td');
        tdStatus.appendChild(badgeStatus(p));
        tr.appendChild(tdStatus);

        const tdAksi = el('td');
        const btn = el('button', 'btn btn-sm btn-success', 'Kembalikan');
        btn.type = 'button';
        btn.addEventListener('click', function () {
          if (confirm('Kembalikan buku "' + p.judul + '"?')) {
            kembalikanBuku(p.id);
            tampil();
          }
        });
        tdAksi.appendChild(btn);
        tr.appendChild(tdAksi);

        tbody.appendChild(tr);
      });

      tabel.append(thead, tbody);
      bungkus.appendChild(tabel);
      area.appendChild(bungkus);
    }

    if (!getSesi()) {
      area.appendChild(pesanLogin());
    } else {
      tampil();
    }
  </script>
</body>
</html>
