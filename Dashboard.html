<!doctype html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Perpustakaan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    .layout { display: flex; flex: 1; }
    .sidebar { width: 280px; flex-shrink: 0; }
    .content { flex: 1; padding: 2rem; min-width: 0; }
    .sidebar .nav-link i { display: inline-block; width: 1.5rem; }
    @media (max-width: 767.98px) {
      .layout { flex-direction: column; }
      .sidebar { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="d-flex flex-column min-vh-100">

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar bg-body-tertiary border-bottom px-3">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="bi bi-book-half me-2 fs-4"></i> Perpustakaan
      </a>
      <div class="d-flex flex-wrap align-items-center gap-2">
        <form class="d-flex" role="search" action="Koleksi%20Buku.html" method="get">
          <div class="input-group">
            <input type="search" class="form-control" name="q" placeholder="Cari Judul Komik dan Novel ...." aria-label="Cari buku" required>
            <button class="btn btn-outline-secondary" type="submit" aria-label="Cari"><i class="bi bi-search"></i></button>
          </div>
        </form>
        <div id="authNav" class="d-flex flex-wrap align-items-center gap-2"></div>
      </div>
    </nav>

    <div class="layout">

      <!-- ===== SIDEBAR ===== -->
      <aside class="sidebar d-flex flex-column p-3 bg-body-tertiary border-end">
        <ul class="nav nav-pills flex-column mb-auto">
          <li class="nav-item">
            <a href="index.html" class="nav-link link-body-emphasis"><i class="bi bi-house me-2"></i> Beranda</a>
          </li>
          <li>
            <a href="Dashboard.html" class="nav-link active" aria-current="page"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
          </li>
          <li>
            <a href="Koleksi%20Buku.html" class="nav-link link-body-emphasis"><i class="bi bi-journal-bookmark me-2"></i> Koleksi Buku</a>
          </li>
          <li>
            <a href="Peminjaman.html" class="nav-link link-body-emphasis"><i class="bi bi-box-arrow-up-right me-2"></i> Peminjaman</a>
          </li>
          <li>
            <a href="Pengembalian.html" class="nav-link link-body-emphasis"><i class="bi bi-box-arrow-in-down-left me-2"></i> Pengembalian</a>
          </li>
          <li>
            <a href="Riwayat%20peminjaman.html" class="nav-link link-body-emphasis"><i class="bi bi-clock-history me-2"></i> Riwayat Peminjaman</a>
          </li>
        </ul>
        <hr>
      </aside>

      <!-- ===== KONTEN ===== -->
      <main class="content">
        <h1 class="h3 mb-1">Dashboard</h1>
        <p id="keterangan" class="text-body-secondary mb-4"></p>

        <div class="row g-3">
          <div class="col-12 col-md-6 col-xl-3">
            <div class="card shadow-sm"><div class="card-body">
              <div class="text-body-secondary small">Total Buku</div>
              <div id="totalBuku" class="fs-3 fw-bold">0</div>
            </div></div>
          </div>
          <div class="col-12 col-md-6 col-xl-3">
            <div class="card shadow-sm"><div class="card-body">
              <div class="text-body-secondary small">Sedang Dipinjam</div>
              <div id="dipinjam" class="fs-3 fw-bold">0</div>
            </div></div>
          </div>
          <div class="col-12 col-md-6 col-xl-3">
            <div class="card shadow-sm"><div class="card-body">
              <div class="text-body-secondary small">Dikembalikan</div>
              <div id="dikembalikan" class="fs-3 fw-bold">0</div>
            </div></div>
          </div>
          <div class="col-12 col-md-6 col-xl-3">
            <div class="card shadow-sm"><div class="card-body">
              <div class="text-body-secondary small">Terlambat</div>
              <div id="terlambat" class="fs-3 fw-bold">0</div>
            </div></div>
          </div>
        </div>
      </main>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data.js"></script>
  <script>
    renderAuthNav();

    const s = getSesi();
    const daftar = pinjamanTampil();

    document.getElementById('totalBuku').textContent = DB.get('buku', []).length;
    document.getElementById('dipinjam').textContent = daftar.filter(p => p.status === 'Dipinjam').length;
    document.getElementById('dikembalikan').textContent = daftar.filter(p => p.status === 'Dikembalikan').length;
    document.getElementById('terlambat').textContent = daftar.filter(terlambat).length;

    document.getElementById('keterangan').textContent = !s
      ? 'Login untuk melihat data peminjaman Anda.'
      : (s.role === 'admin' ? 'Ringkasan seluruh peminjaman.' : 'Ringkasan peminjaman Anda.');
  </script>
</body>
</html>
