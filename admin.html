<!doctype html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kelola Buku - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <script src="data.js"></script>
  <script>wajibAdmin();</script>
  <style>
    .thumb { width: 48px; height: 64px; object-fit: cover; border-radius: .25rem; }
    .thumb-kosong { width: 48px; height: 64px; border-radius: .25rem; }
    #preview { max-height: 200px; }
  </style>
</head>
<body class="bg-body-tertiary">

  <nav class="navbar bg-body border-bottom px-3">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <i class="bi bi-book-half me-2 fs-4"></i> Perpustakaan
      <span class="badge text-bg-primary ms-2">Admin</span>
    </a>
    <div class="d-flex align-items-center gap-2">
      <a href="Koleksi%20Buku.html" class="btn btn-outline-primary btn-sm">
        <i class="bi bi-journal-bookmark me-1"></i> Lihat Koleksi
      </a>
      <button type="button" class="btn btn-outline-danger btn-sm" onclick="keluar()">
        <i class="bi bi-box-arrow-right me-1"></i> Keluar
      </button>
    </div>
  </nav>

  <div class="container py-4">
    <h1 class="h3 mb-4">Kelola Buku Komik dan Novel</h1>

    <div class="row g-4">

      <!-- Form tambah buku -->
      <div class="col-12 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-header fw-semibold">Tambah Buku</div>
          <div class="card-body">
            <div id="pesan" class="alert d-none" role="alert"></div>

            <form id="form">
              <div class="mb-3">
                <label for="judul" class="form-label">Judul</label>
                <input type="text" class="form-control" id="judul" maxlength="150" required>
              </div>
              <div class="mb-3">
                <label for="jenis" class="form-label">Jenis</label>
                <select class="form-select" id="jenis" required>
                  <option value="Komik">Komik</option>
                  <option value="Novel">Novel</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="genre" class="form-label">Genre</label>
                <select class="form-select" id="genre" required>
                  <option value="">Pilih genre...</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="penulis" class="form-label">Penulis</label>
                <input type="text" class="form-control" id="penulis" maxlength="100" required>
              </div>
              <div class="mb-3">
                <label for="stok" class="form-label">Stok</label>
                <input type="number" class="form-control" id="stok" min="0" value="1" required>
              </div>
              <div class="mb-3">
                <label for="sampul" class="form-label">Gambar Sampul</label>
                <input type="file" class="form-control" id="sampul" accept="image/png,image/jpeg,image/webp">
                <div class="form-text">PNG, JPG, atau WEBP. Gambar dikecilkan otomatis.</div>
                <img id="preview" class="img-thumbnail mt-2 d-none" alt="Pratinjau sampul">
              </div>
              <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-plus-lg me-1"></i> Simpan Buku
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- Daftar buku -->
      <div class="col-12 col-lg-7">
        <div class="card shadow-sm">
          <div class="card-header fw-semibold">Daftar Buku</div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th>Sampul</th>
                  <th>Judul</th>
                  <th>Jenis</th>
                  <th>Genre</th>
                  <th>Stok</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="daftar"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const form = document.getElementById('form');
    const pesan = document.getElementById('pesan');
    const inputSampul = document.getElementById('sampul');
    const preview = document.getElementById('preview');
    const daftar = document.getElementById('daftar');

    // Isi pilihan genre dari DAFTAR_GENRE (data.js)
    const selectGenre = document.getElementById('genre');
    DAFTAR_GENRE.forEach(function (g) {
      const o = el('option', '', g);
      o.value = g;
      selectGenre.appendChild(o);
    });

    function tampil(teks, tipe) {
      pesan.className = 'alert alert-' + tipe;
      pesan.textContent = teks;
    }

    function gambarBuku(b) {
      if (b.sampul) {
        const img = el('img', 'thumb');
        img.src = b.sampul;
        img.alt = 'Sampul ' + b.judul;
        return img;
      }
      const kosong = el('div', 'thumb-kosong bg-secondary-subtle d-flex align-items-center justify-content-center text-secondary');
      const ikon = el('i', 'bi bi-image');
      kosong.appendChild(ikon);
      return kosong;
    }

    function render() {
      const buku = DB.get('buku', []);
      daftar.textContent = '';

      if (buku.length === 0) {
        const tr = el('tr');
        const td = el('td', 'text-center text-body-secondary py-4', 'Belum ada buku.');
        td.colSpan = 6;
        tr.appendChild(td);
        daftar.appendChild(tr);
        return;
      }

      buku.forEach(function (b) {
        const tr = el('tr');

        const tdGambar = el('td');
        tdGambar.appendChild(gambarBuku(b));

        const tdJudul = el('td');
        tdJudul.appendChild(el('div', 'fw-semibold', b.judul));
        tdJudul.appendChild(el('div', 'small text-body-secondary', b.penulis));

        const tdJenis = el('td');
        tdJenis.appendChild(el('span', 'badge ' + (b.jenis === 'Komik' ? 'text-bg-info' : 'text-bg-warning'), b.jenis));

        const tdGenre = el('td');
        if (b.genre) tdGenre.appendChild(el('span', 'badge text-bg-light border', b.genre));
        else tdGenre.appendChild(el('span', 'text-body-secondary', '-'));

        const tdStok = el('td', '', String(b.stok));

        const tdAksi = el('td', 'text-end');
        const hapus = el('button', 'btn btn-sm btn-outline-danger');
        hapus.type = 'button';
        hapus.setAttribute('aria-label', 'Hapus ' + b.judul);
        hapus.appendChild(el('i', 'bi bi-trash'));
        hapus.addEventListener('click', function () {
          if (confirm('Hapus buku "' + b.judul + '"?')) {
            DB.set('buku', DB.get('buku', []).filter(function (x) { return x.id !== b.id; }));
            render();
          }
        });
        tdAksi.appendChild(hapus);

        tr.append(tdGambar, tdJudul, tdJenis, tdGenre, tdStok, tdAksi);
        daftar.appendChild(tr);
      });
    }

    inputSampul.addEventListener('change', async function () {
      const file = inputSampul.files[0];
      if (!file) { preview.classList.add('d-none'); return; }
      try {
        preview.src = await kecilkanGambar(file, 400);
        preview.classList.remove('d-none');
      } catch (e) {
        preview.classList.add('d-none');
        tampil('File bukan gambar yang valid.', 'danger');
        inputSampul.value = '';
      }
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const buku = DB.get('buku', []);
      buku.unshift({
        id: Date.now(),
        judul: document.getElementById('judul').value.trim(),
        jenis: document.getElementById('jenis').value,
        genre: document.getElementById('genre').value,
        penulis: document.getElementById('penulis').value.trim(),
        stok: parseInt(document.getElementById('stok').value, 10) || 0,
        sampul: preview.classList.contains('d-none') ? '' : preview.src
      });

      if (DB.set('buku', buku)) {
        tampil('Buku berhasil ditambahkan.', 'success');
        form.reset();
        preview.classList.add('d-none');
        preview.removeAttribute('src');
        render();
      }
    });

    render();
  </script>
</body>
</html>
