<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-6 col-lg-4">

        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h4 mb-4 text-center">Login</h1>

            <div id="pesan" class="alert alert-danger d-none" role="alert"></div>

            <form id="form">
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" autocomplete="username" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" autocomplete="current-password" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>

            <p class="text-center small mt-3 mb-1">
              Belum punya akun? <a href="registrasi.html">Registrasi</a>
            </p>
            <p class="text-center small mb-0">
              <a href="login_admin.html">Login sebagai admin</a> &middot; <a href="index.html">Beranda</a>
            </p>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    document.getElementById('form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const ok = await masuk(
        document.getElementById('username').value,
        document.getElementById('password').value,
        'user'
      );
      if (ok) {
        location.href = 'Koleksi%20Buku.html';
      } else {
        const p = document.getElementById('pesan');
        p.textContent = 'Username atau password salah.';
        p.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
